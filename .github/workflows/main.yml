name: Deploy Portfolio on EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      # ------------------------------
      # CHECKOUT & NODE SETUP
      # ------------------------------
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            package.json

      # ------------------------------
      # PROJECT SETUP
      # ------------------------------
      - name: Install project dependencies
        run: npm install

      - name: Create .env file
        run: |
          touch .env
          echo "${{ secrets.PROD_PORTFOLIO_ENV }}" > .env
          echo "PORT=${{ secrets.PORT }}" >> .env

      - name: Build project (React/Next.js)
        run: npm run build

      # ------------------------------
      # DEPLOY TO PERSISTENT FOLDER
      # ------------------------------
      - name: Deploy build to persistent folder
        run: |
          mkdir -p ~/portfolio-website
          # Remove old files but keep .pm2 configuration
          rsync -a --delete --exclude='.pm2' ./ ~/portfolio-website/

      # ------------------------------
      # START PROJECT WITH PM2
      # ------------------------------
      - name: Install PM2 globally if not available
        run: |
          which pm2 || npm install -g pm2

      - name: Start project with PM2
        run: |
          cd ~/portfolio-website
          # Stop existing process if any
          pm2 delete portfolio || true
          # Start project using PORT from .env
          pm2 start npm --name portfolio -- start
          # Save PM2 config and setup auto-restart on boot
          pm2 save
          pm2 startup systemd -u ubuntu --hp /home/ubuntu || true

      # ------------------------------
      # NGINX CONFIGURATION
      # ------------------------------
      - name: Configure Nginx for portfolio
        run: |
          PORT="${{ secrets.PORT }}"
          CONFIG_FILE="/tmp/portfolio-nginx.conf"

          # Generate Nginx config dynamically with PORT
          cat > $CONFIG_FILE <<EOL
# HTTP redirect
server {
    listen 80;
    server_name chaitanya.cerbq.com;
    return 301 https://\$server_name\$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name chaitanya.cerbq.com;

    ssl_certificate /etc/ssl/certs/cerbq.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/private/cerbq.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    location / {
        proxy_pass http://localhost:${PORT};
        proxy_http_version 1.1;
        proxy_set_header Upgrade \$http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host \$host;
        proxy_set_header X-Real-IP \$remote_addr;
        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto \$scheme;
        proxy_cache_bypass \$http_upgrade;
    }
}
EOL

          # Determine where to copy
          if [ -d "/etc/nginx/conf.d" ]; then
            sudo cp $CONFIG_FILE /etc/nginx/conf.d/portfolio.conf
          elif [ -d "/etc/nginx/sites-available" ]; then
            sudo cp $CONFIG_FILE /etc/nginx/sites-available/portfolio
            sudo ln -sf /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/portfolio
          else
            sudo mkdir -p /etc/nginx/conf.d
            sudo cp $CONFIG_FILE /etc/nginx/conf.d/portfolio.conf
          fi

          # Test and reload Nginx
          sudo nginx -t && sudo systemctl reload nginx || sudo service nginx reload || sudo nginx -s reload

  # ------------------------------
  # CLEANUP ARTIFACTS
  # ------------------------------
  cleanup:
    runs-on: self-hosted
    needs: deploy
    steps:
      - name: Cleanup portfolio runner artifacts
        run: |
          echo "Cleaning _work directory for portfolio runner..."
          rm -rf ~/actions-runner-portfolio/_work/*
          npm cache clean --force || true
          echo "Cleanup complete."
